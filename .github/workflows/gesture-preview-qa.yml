name: 手势设置界面检查
on:
  push:
    branches: [codex/gesture-preview-qa]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read synthetic render previews from the verified build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, io, json, os, time, urllib.request, urllib.error, zipfile
          base = "https://api.github.com/repos/shaklow/ColorOS-SuperCard"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          artifact = None
          for attempt in range(60):
              with urllib.request.urlopen(urllib.request.Request(base + "/actions/runs/39898679153/artifacts", headers=headers), timeout=30) as response:
                  found = json.load(response)["artifacts"]
              artifact = next((a for a in found if a["name"] == "supercard-pr-test"), None)
              if artifact:
                  break
              time.sleep(10)
          assert artifact, "Build previews are unavailable"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, url):
                  return None
          try:
              urllib.request.build_opener(NoRedirect()).open(urllib.request.Request(artifact["archive_download_url"], headers=headers), timeout=30)
              raise AssertionError("Expected an artifact download redirect")
          except urllib.error.HTTPError as redirect:
              assert redirect.code == 302, redirect.code
              location = redirect.headers["Location"]
          with urllib.request.urlopen(location, timeout=90) as response:
              archive = zipfile.ZipFile(io.BytesIO(response.read()))
          images = ["gestures-320-light-36.png", "gestures-bottom-320-dark-36.png", "gestures-600-light-31.png", "gestures-bottom-600-light-31.png"]
          for image in images:
              names = [n for n in archive.namelist() if n.endswith("/" + image) or n == image]
              assert len(names) == 1, image
              print("SUPERCARD_QA_IMAGE|" + image + "|" + base64.b64encode(archive.read(names[0])).decode("ascii"))
          print("SUPERCARD_QA_RENDER_COUNT=" + str(sum(n.endswith(".png") for n in archive.namelist())))
