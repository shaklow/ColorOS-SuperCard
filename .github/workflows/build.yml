name: 构建统一 APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      compare_reference:
        description: 与已确认的 ci/reference-apk.json 基准比较
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    environment: release
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 配置与本地一致的 JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.9+10.0.LTS'
      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: 配置 Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw '运行器没有 Android SDK' }
          $manager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $manager 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK 安装失败' }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 载入 release 环境签名
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.SUPERCARD_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'release 环境缺少 SUPERCARD_KEYSTORE_BASE64 Secret' }
          $target = Join-Path $env:USERPROFILE '.android/debug.keystore'
          New-Item -ItemType Directory -Force (Split-Path -Parent $target) | Out-Null
          [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
      - name: 编译与合包
        shell: pwsh
        env:
          COMPARE_REFERENCE: ${{ inputs.compare_reference }}
          SUPERCARD_PREVIEW_DIR: ${{ github.workspace }}/dist/ui-previews
        run: |
          if ($env:COMPARE_REFERENCE -eq 'true') { ./ci/build.ps1 }
          else { ./ci/build.ps1 -SkipReference }
      - name: 核对本仓库签名证书
        shell: pwsh
        run: |
          $actual = (Get-Content -Raw dist/resource-verification.json | ConvertFrom-Json).signingCertificateSha256
          $expected = (Get-Content -Raw ci/signing-certificate.sha256).Trim()
          if ($actual -ne $expected) { throw '签名证书与本地基准不一致' }
      - name: 上传已核对产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supercard-unified
          path: |
            dist/SuperCard-*-unified.apk
            dist/SHA256SUMS.txt
            dist/resource-verification.json
            dist/apk-fingerprint.json
            dist/ui-previews/
            dist/comparison.json
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - name: 保存失败的依赖校验与产物比较报告
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics
          path: |
            build/reports/dependency-verification/
            app/build/test-results/
            dhu-ui/build/test-results/
            dist/comparison.json
            dist/apk-fingerprint.json
            dist/ui-previews/
          if-no-files-found: ignore
          retention-days: 7
      - name: 清理签名临时文件
        if: always()
        shell: pwsh
        run: |
          $target = Join-Path $env:USERPROFILE '.android/debug.keystore'
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Force }

  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 配置 JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.9+10.0.LTS'
      - name: 配置 Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: 配置 Android SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw '运行器没有 Android SDK' }
          & (Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat') 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK 安装失败' }
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: 使用临时调试签名编译与合包
        env:
          SUPERCARD_PREVIEW_DIR: ${{ github.workspace }}/dist/ui-previews
        shell: pwsh
        run: ./ci/build.ps1 -SkipReference
      - name: 上传 PR 测试安装包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supercard-pr-test
          path: |
            dist/SuperCard-*-unified.apk
            dist/SHA256SUMS.txt
            dist/resource-verification.json
            dist/apk-fingerprint.json
            dist/ui-previews/
          if-no-files-found: error
          retention-days: 7
      - name: 上传设备启动测试 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: settings-startup-pr-instrumentation
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
      - name: 保存失败诊断
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-build-diagnostics
          path: |
            build/reports/dependency-verification/
            app/build/test-results/
            dhu-ui/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  settings-startup:
    name: Android 36 浮层与设置回归
    needs: [build, pull-request]
    if: always() && (needs.build.result == 'success' || needs.pull-request.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 下载统一 APK 与测试 APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'supercard-pr-test' || 'supercard-unified' }}
          path: smoke
      - name: 下载 PR 设备测试 APK
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: settings-startup-pr-instrumentation
          path: smoke/instrumentation
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 安装并验证浮层与设置页面
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1560
            adb shell wm density 280
            python tools/test_settings_startup.py --secure-native --timeout 360 --install-from smoke --logcat-out smoke/logcat.txt
      - name: 保存设备启动日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: settings-startup-log
          path: smoke/logcat.txt
          if-no-files-found: ignore
          retention-days: 7
